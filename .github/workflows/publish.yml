name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify the wheel imports and exposes the guardrail
        run: |
          python -m pip install dist/*.whl
          python -c "import openhands_nti; print(openhands_nti.__version__)"
      - name: Verify __version__ resolves from installed metadata
        run: |
          python - <<'EOF'
          import importlib.metadata as md
          import openhands_nti

          assert openhands_nti.__version__ == md.version("openhands-nti"), (
              f"runtime {openhands_nti.__version__!r} != dist-info "
              f"{md.version('openhands-nti')!r}"
          )
          assert openhands_nti.__version__ != "0.0.0+unknown", "metadata lookup failed"
          print("version resolves:", openhands_nti.__version__)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # No environment: the PyPI trusted publisher is registered without one, so
    # the OIDC `sub` claim must not carry an `:environment:<name>` suffix.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
