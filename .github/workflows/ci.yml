name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # On pull_request the default ref is the synthetic merge commit, which
          # GitHub creates and can never carry a sign-off. Check the PR head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check every commit is signed off
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "${base}" ]; then
            # Pushes: check only what this push added. An all-zero `before`
            # means a new branch, so fall back to the parent of HEAD.
            base="${{ github.event.before }}"
            case "${base}" in
              ""|0000000000000000000000000000000000000000) base="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -n1)" ;;
            esac
          fi
          missing=0
          while read -r sha; do
            [ -z "${sha}" ] && continue
            if ! git log -1 --format='%B' "${sha}" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit ${sha} is missing a Signed-off-by line"
              missing=1
            fi
          # --no-merges: a merge commit synthesised by GitHub (the pull_request
          # ref or the web merge button) has no author commit to sign, so
          # holding it to DCO fails runs whose real commits are signed.
          done < <(git rev-list --no-merges "${base}..HEAD")
          exit "${missing}"

  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        env:
          OPENHANDS_SUPPRESS_BANNER: "1"
        run: pytest -q

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
